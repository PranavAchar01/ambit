[project]
name = "gridsight"
version = "0.1.0"
description = "Vector-routed machine-vision model registry for infrastructure inspection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib>=2.1.0",
    "open-clip-torch>=2.30.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pymongo>=4.10.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-mongodb>=0.1.3",
    "openai>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "huggingface-hub>=0.27.0",
    "datasets>=3.2.0",
    "pillow>=10.4.0",
    "imagehash>=4.3.1",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "types-Pillow>=10.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridsight"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["gridsight", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["B008", "C401"]

[tool.ruff.lint.isort]
known-first-party = ["gridsight", "conftest"]

[tool.mypy]
python_version = "3.12"
files = ["gridsight"]
strict = false
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:warnings"
markers = [
    "live: tests that require a live MongoDB Atlas connection",
    "slow: tests that train models",
]
