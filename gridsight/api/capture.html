<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Ambit — capture</title>
<style>
  /* Served straight from the API so one tunnel covers the page, the socket and
     the upload. Same two colours, same font, same zero-radius rule as the app. */
  @font-face {
    font-family: "CMU Typewriter Text";
    src: url("/fonts/cmu-typewriter-text-500-roman.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  html, body {
    background: #000; color: #e8e8e8; height: 100%; overflow: hidden;
    font-family: "CMU Typewriter Text", ui-monospace, monospace;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  .bar {
    position: fixed; left: 0; right: 0; display: flex; align-items: center;
    gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(0,0,0,0.72); border-bottom: 1px solid #262626;
  }
  #top { top: 0; }
  .dot { width: 8px; height: 8px; background: #5f5f5f; flex: 0 0 auto; }
  .dot[data-on="true"] { background: #ff2d2d; }
  .spacer { flex: 1 1 auto; }
  .faint { color: #5f5f5f; }

  /* Hold-still progress. A flat bar -- no ring, no easing, no gradient. */
  #holdwrap {
    position: fixed; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom));
    border: 1px solid #262626; background: rgba(0,0,0,0.72); padding: 10px;
  }
  #holdlabel { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
  #holdtrack { margin-top: 8px; height: 6px; background: #111; border: 1px solid #262626; }
  #holdfill { height: 100%; width: 0%; background: #ff2d2d; }

  #verdict {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.86); border-top: 1px solid #262626; min-height: 84px;
  }
  #vline { display: flex; align-items: baseline; gap: 10px; }
  #vbadge {
    font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid #3a3a3a; padding: 3px 8px; color: #9a9a9a;
  }
  #vbadge[data-attention="true"] { color: #ff2d2d; border-color: #ff2d2d; }
  #vmeta { font-size: 12px; color: #9a9a9a; }
  #vnote { margin-top: 6px; font-size: 12px; color: #5f5f5f; line-height: 1.45; }

  /* The whole frame flashes red only when something actually wants attention. */
  #stage[data-attention="true"]::after {
    content: ""; position: fixed; inset: 0; border: 3px solid #ff2d2d; pointer-events: none;
  }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
    background: #000; text-align: center; font-size: 14px; line-height: 1.6;
  }
  #fatal[data-show="true"] { display: grid; }
  #fatal strong { color: #ff2d2d; display: block; margin-bottom: 10px; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline muted></video>
</div>

<div class="bar" id="top">
  <span class="dot" id="dcam"></span><span>cam</span>
  <span class="dot" id="dws"></span><span>link</span>
  <span class="spacer"></span>
  <span class="faint" id="sid"></span>
  <span class="faint" id="fps"></span>
</div>

<div id="holdwrap">
  <div id="holdlabel">Hold still to inspect</div>
  <div id="holdtrack"><div id="holdfill"></div></div>
</div>

<div id="verdict">
  <div id="vline">
    <span id="vbadge">standby</span>
    <span id="vmeta"></span>
  </div>
  <div id="vnote">Point at a board and hold steady for two seconds.</div>
</div>

<div id="fatal"><div><strong>Camera unavailable</strong><span id="fatalmsg"></span></div></div>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const SESSION = params.get("s") || "demo";

  /* --------------------------------------------------------------------
   * Everything per-frame that can leave the main thread has left it.
   *
   * The main thread now does exactly two things per camera frame: blit the
   * video into a small OffscreenCanvas, and transfer that frame to a worker.
   * Both are GPU-side and zero-copy. Previously it also ran getImageData for
   * motion detection (a readback that stalls the GPU pipeline) and, at capture
   * time, a full-resolution PNG encode -- a multi-hundred-millisecond freeze
   * landing exactly when the operator was holding the phone still.
   *
   * Pacing is AIMD, not a binary gate. The old code ran flat out until the
   * socket saturated, hard-stopped, drained, then burst again -- a sawtooth
   * that reads as lag spikes. Multiplicative decrease on congestion plus
   * additive increase on headroom converges smoothly instead.
   *
   * Frames cross the public internet: cloudflared hauls every one to a
   * Cloudflare edge and back, so the uplink -- not the encoder -- sets the
   * ceiling. Hence pacing and quality both adapt, and neither is a constant.
   * ------------------------------------------------------------------ */
  // 320x240, and the smaller frame is why this is fast rather than a compromise
  // against it. Measured over the live tunnel at a fixed send rate:
  //
  //   480x360 q50  23.1KB  27.7fps  latency p50 116ms  p95 350ms  jitter 46.8ms
  //   320x240 q40   9.3KB  42.2fps  latency p50  24ms  p95 111ms  jitter 24.6ms
  //
  // Better on every axis at once, including frame rate. Fat frames do not
  // arrive late because they are slow to encode -- they arrive late because
  // they queue, and a queue is latency. Bytes on the wire are the budget.
  const PREVIEW_W = 320, PREVIEW_H = 240;
  const FPS_START = 30, FPS_MIN = 8, FPS_MAX = 60;
  const CAMERA_FPS = 60;
  const Q_MAX = 0.55, Q_MIN = 0.30, Q_START = 0.42;
  // Buffer IS latency, so these are deliberately small. The old 128KB ceiling
  // let a dozen frames queue -- video already committed to the wire before
  // pacing could react, felt as lag rather than seen as stutter. At ~9KB a
  // frame, 24KB is under three.
  const UPLINK_HIGH = 24 * 1024;    // congestion signal
  const UPLINK_LOW = 6 * 1024;      // headroom signal
  const MAX_INFLIGHT = 2;           // in-flight frames are latency too
  const MOTION_HZ = 8;
  const HOLD_MS = 2000;
  const STILL_THRESHOLD = 0.012;
  const MOVED_THRESHOLD = 0.030;

  const el = (id) => document.getElementById(id);
  const video = el("v");
  el("sid").textContent = SESSION;

  let stillMs = 0, state = "idle";
  let wsReady = false, inflight = 0, socketBacklog = 0;
  let targetFps = FPS_START, lastSent = 0, lastMotionAt = 0;
  let framesSent = 0, fpsCount = 0, fpsAt = 0, quality = Q_START;
  let pendingFull = null;

  /* ---------------- encoder + analyser worker ---------------- */
  const WORKER_SRC = [
    'var ws=null, canvas=null, ctx=null, motion=null, mctx=null, prev=null;',
    'var quality=' + Q_START + ', sent=0, streak=0;',
    'var W=' + PREVIEW_W + ', H=' + PREVIEW_H + ';',
    'var Q_MAX=' + Q_MAX + ', Q_MIN=' + Q_MIN + ', HIGH=' + UPLINK_HIGH + ', LOW=' + UPLINK_LOW + ';',
    'function connect(url){',
    '  ws=new WebSocket(url); ws.binaryType="arraybuffer";',
    '  ws.onopen=function(){postMessage({type:"ws",ready:true});};',
    '  ws.onclose=function(){postMessage({type:"ws",ready:false}); setTimeout(function(){connect(url);},1000);};',
    '  ws.onerror=function(){ if(ws) ws.close(); };',
    '}',
    'function buffered(){ return ws && ws.readyState===1 ? ws.bufferedAmount : 0; }',
    // Motion runs here so the readback never touches the main thread.
    'function score(){',
    '  if(!motion){ motion=new OffscreenCanvas(64,48); mctx=motion.getContext("2d",{willReadFrequently:true}); }',
    '  mctx.drawImage(canvas,0,0,64,48);',
    '  var d=mctx.getImageData(0,0,64,48).data, n=64*48, cur=new Uint8Array(n), i=0, p=0, s=0;',
    '  for(i=0,p=0;p<n;i+=4,p++){ cur[p]=(d[i]*77+d[i+1]*151+d[i+2]*28)>>8; }',
    '  if(!prev){ prev=cur; return 1; }',
    '  for(p=0;p<n;p++){ s+=Math.abs(cur[p]-prev[p]); }',
    '  prev=cur; return s/n/255;',
    '}',
    'self.onmessage=async function(e){',
    '  var m=e.data;',
    '  if(m.type==="connect"){ connect(m.url); return; }',
    '  if(m.type==="json"){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(m.payload)); return; }',
    '  if(m.type==="poll"){ postMessage({type:"stat",sent:sent,quality:quality,buffered:buffered()}); return; }',
    // Full-resolution PNG for the actual inspection, encoded off the main thread.
    '  if(m.type==="full"){',
    '    var fc=new OffscreenCanvas(m.bitmap.width,m.bitmap.height);',
    '    fc.getContext("2d",{alpha:false}).drawImage(m.bitmap,0,0);',
    '    m.bitmap.close();',
    '    try{ var pb=await fc.convertToBlob({type:"image/png"}); postMessage({type:"full",blob:pb}); }',
    '    catch(err){ postMessage({type:"full",blob:null,error:String(err)}); }',
    '    return;',
    '  }',
    '  if(m.type!=="frame") return;',
    '  var bmp=m.bitmap;',
    '  if(!ws||ws.readyState!==1){ bmp.close(); postMessage({type:"done"}); return; }',
    '  var b=ws.bufferedAmount;',
    '  if(b>HIGH){ quality=Math.max(Q_MIN,quality-0.06); streak=0; }',
    '  else if(b<LOW){ streak++; if(streak>20){ quality=Math.min(Q_MAX,quality+0.02); streak=0; } }',
    '  if(!canvas){ canvas=new OffscreenCanvas(W,H); ctx=canvas.getContext("2d",{alpha:false}); }',
    '  ctx.drawImage(bmp,0,0,W,H); bmp.close();',
    '  if(m.motion){ postMessage({type:"motion",score:score()}); }',
    '  try{',
    '    var blob=await canvas.convertToBlob({type:"image/jpeg",quality:quality});',
    '    if(ws&&ws.readyState===1){ ws.send(blob); sent++; }',
    '    postMessage({type:"stat",sent:sent,quality:quality,buffered:buffered()});',
    '  }catch(err){}',
    '  postMessage({type:"done"});',
    '};'
  ].join("\n");

  const workerSupported =
    typeof Worker !== "undefined" &&
    typeof OffscreenCanvas !== "undefined" &&
    typeof OffscreenCanvas.prototype.transferToImageBitmap === "function" &&
    typeof OffscreenCanvas.prototype.convertToBlob === "function";

  let worker = null;
  let scaler = null, sctx = null;            // worker path: zero-copy source
  let fbCanvas = null, fbCtx = null, fbSocket = null, fbProbe = null, fbPctx = null, fbPrev = null;

  function setDot(id, on) { el(id).dataset.on = on ? "true" : "false"; }

  function send(obj) {
    if (worker) worker.postMessage({ type: "json", payload: obj });
    else if (fbSocket && fbSocket.readyState === 1) fbSocket.send(JSON.stringify(obj));
  }

  function setPhase(phase, extra) {
    state = phase;
    send(Object.assign({ type: "phase", phase: phase }, extra || {}));
  }

  function socketUrl() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    return `${scheme}://${location.host}/live/publish/${encodeURIComponent(SESSION)}`;
  }

  /** AIMD: back off hard on congestion, recover gently. Converges without sawtooth. */
  function pace(backlog) {
    if (backlog > UPLINK_HIGH) targetFps = Math.max(FPS_MIN, targetFps * 0.7);
    else if (backlog < UPLINK_LOW) targetFps = Math.min(FPS_MAX, targetFps + 1);
  }

  function startWorker() {
    worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "application/javascript" })));
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "ws") {
        wsReady = m.ready; setDot("dws", m.ready);
        if (m.ready) setPhase(state); else socketBacklog = 0;
      } else if (m.type === "stat") {
        framesSent = m.sent; quality = m.quality; socketBacklog = m.buffered; pace(m.buffered);
      } else if (m.type === "done") {
        inflight = Math.max(0, inflight - 1);
      } else if (m.type === "motion") {
        applyMotion(m.score);
      } else if (m.type === "full") {
        if (pendingFull) { pendingFull(m.blob); pendingFull = null; }
      }
    };
    worker.postMessage({ type: "connect", url: socketUrl() });
    scaler = new OffscreenCanvas(PREVIEW_W, PREVIEW_H);
    sctx = scaler.getContext("2d", { alpha: false });
  }

  function startFallback() {
    fbCanvas = document.createElement("canvas");
    fbCanvas.width = PREVIEW_W; fbCanvas.height = PREVIEW_H;
    fbCtx = fbCanvas.getContext("2d", { alpha: false });
    fbProbe = document.createElement("canvas");
    fbProbe.width = 64; fbProbe.height = 48;
    fbPctx = fbProbe.getContext("2d", { willReadFrequently: true });
    const open = () => {
      fbSocket = new WebSocket(socketUrl());
      fbSocket.binaryType = "arraybuffer";
      fbSocket.onopen = () => { wsReady = true; setDot("dws", true); setPhase(state); };
      fbSocket.onclose = () => { wsReady = false; setDot("dws", false); setTimeout(open, 1000); };
      fbSocket.onerror = () => fbSocket.close();
    };
    open();
  }

  function fallbackMotion() {
    fbPctx.drawImage(video, 0, 0, 64, 48);
    const d = fbPctx.getImageData(0, 0, 64, 48).data;
    const n = 64 * 48, cur = new Uint8Array(n);
    for (let i = 0, p = 0; p < n; i += 4, p++) cur[p] = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;
    if (!fbPrev) { fbPrev = cur; return 1; }
    let s = 0;
    for (let p = 0; p < n; p++) s += Math.abs(cur[p] - fbPrev[p]);
    fbPrev = cur;
    return s / n / 255;
  }

  function pushFrame(now, wantMotion) {
    if (!wsReady || inflight >= MAX_INFLIGHT) return false;
    if (socketBacklog > UPLINK_HIGH) {
      if (worker) worker.postMessage({ type: "poll" });   // else the reading goes stale-high
      return false;
    }

    if (worker) {
      inflight++;
      // Blit + transferToImageBitmap is synchronous, GPU-side and zero-copy --
      // cheaper and far more predictable than awaiting createImageBitmap(video).
      sctx.drawImage(video, 0, 0, PREVIEW_W, PREVIEW_H);
      worker.postMessage(
        { type: "frame", bitmap: scaler.transferToImageBitmap(), motion: wantMotion },
        []
      );
      return true;
    }

    if (fbSocket.bufferedAmount > UPLINK_HIGH) { pace(fbSocket.bufferedAmount); return false; }
    pace(fbSocket.bufferedAmount);
    inflight++;
    fbCtx.drawImage(video, 0, 0, PREVIEW_W, PREVIEW_H);
    fbCanvas.toBlob((blob) => {
      inflight = Math.max(0, inflight - 1);
      if (blob && fbSocket && fbSocket.readyState === 1) { fbSocket.send(blob); framesSent++; }
    }, "image/jpeg", quality);
    if (wantMotion) applyMotion(fallbackMotion());
    return true;
  }

  function setHold(fraction, label) {
    el("holdfill").style.width = `${Math.round(Math.min(1, fraction) * 100)}%`;
    el("holdlabel").textContent = label;
  }

  function setVerdict(badge, meta, note, attention) {
    el("vbadge").textContent = badge;
    el("vbadge").dataset.attention = attention ? "true" : "false";
    el("stage").dataset.attention = attention ? "true" : "false";
    el("vmeta").textContent = meta || "";
    el("vnote").textContent = note || "";
  }

  function applyMotion(score) {
    const now = performance.now();
    const dt = lastMotionAt ? now - lastMotionAt : 1000 / MOTION_HZ;
    lastMotionAt = now;
    if (state === "inspecting") return;

    if (state === "cooldown") {
      if (score > MOVED_THRESHOLD) { state = "idle"; setPhase("idle"); }
      return;
    }
    if (score < STILL_THRESHOLD) {
      stillMs = Math.min(HOLD_MS, stillMs + dt);
      setHold(stillMs / HOLD_MS, `Holding ${(stillMs / 1000).toFixed(1)}s / 2.0s`);
      send({ type: "phase", phase: "holding", progress: stillMs / HOLD_MS });
      if (stillMs >= HOLD_MS) void inspect();
    } else {
      if (stillMs > 0) setHold(0, "Hold still to inspect");
      stillMs = 0;
    }
  }

  /**
   * PNG, not JPEG, and deliberately so. Measured against the registry, JPEG
   * recompression costs 0.01-0.024 of routing score -- enough to push a frame
   * under a tight coverage gate and turn a real inspection into a refusal.
   * The encode happens in the worker: on the main thread it froze the
   * viewfinder for hundreds of milliseconds at the worst possible moment.
   */
  function captureFull() {
    return new Promise((resolve) => {
      const w = video.videoWidth || 1280, h = video.videoHeight || 720;
      if (worker) {
        const fc = new OffscreenCanvas(w, h);
        fc.getContext("2d", { alpha: false }).drawImage(video, 0, 0, w, h);
        pendingFull = resolve;
        worker.postMessage({ type: "full", bitmap: fc.transferToImageBitmap() }, []);
        return;
      }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d", { alpha: false }).drawImage(video, 0, 0, w, h);
      c.toBlob((b) => resolve(b), "image/png");
    });
  }

  async function inspect() {
    setPhase("inspecting");
    setHold(1, "Inspecting…");
    setVerdict("working", "", "Uploading full-resolution frame to the agent.", false);

    const blob = await captureFull();
    if (!blob) {
      setVerdict("error", "", "could not encode the frame", true);
      return rearm();
    }
    send({ type: "captured", bytes: blob.size });

    const form = new FormData();
    form.append("image", blob, "phone.png");

    let res;
    try {
      res = await fetch("/inspect/stream", { method: "POST", body: form });
    } catch (e) {
      setVerdict("error", "", String(e), true);
      send({ type: "error", message: String(e) });
      return rearm();
    }
    if (!res.ok || !res.body) {
      const msg = `inspect responded ${res.status}`;
      setVerdict("error", "", msg, true);
      send({ type: "error", message: msg });
      return rearm();
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop() || "";
      for (const f of frames) {
        const evLine = f.split("\n").find((l) => l.startsWith("event: "));
        const dtLine = f.split("\n").find((l) => l.startsWith("data: "));
        if (!evLine || !dtLine) continue;
        const event = evLine.slice(7).trim();
        const data = JSON.parse(dtLine.slice(6));
        send({ type: event, data: data });

        if (event === "step") {
          setHold(1, data.label || data.node || "working");
        } else if (event === "result") {
          const attention = data.verdict === "defect" || data.verdict === "unroutable";
          const meta = [data.asset_class, data.latency_ms ? `${data.latency_ms} ms` : null]
            .filter(Boolean).join(" · ");
          setVerdict(data.verdict, meta, data.narrative || "", attention);
        } else if (event === "error") {
          setVerdict("error", "", data.message, true);
        }
      }
    }
    rearm();
  }

  function rearm() {
    stillMs = 0;
    setPhase("cooldown");
    setHold(0, "Move, then hold still again");
  }

  function onFrame(now) {
    if (video.readyState >= 2) {
      const dueAt = lastSent + 1000 / targetFps;
      if (now >= dueAt) {
        const wantMotion = now - lastMotionAt >= 1000 / MOTION_HZ;
        if (pushFrame(now, wantMotion)) lastSent = now;
      }
      if (now - fpsAt > 1000) {
        const fps = Math.round(((framesSent - fpsCount) * 1000) / (now - fpsAt));
        el("fps").textContent = `${fps}/${Math.round(targetFps)}fps q${quality.toFixed(2)}`;
        fpsCount = framesSent; fpsAt = now;
      }
    }
    schedule();
  }

  // rVFC fires once per decoded camera frame -- the correct clock. rAF free-runs
  // at display rate, which is not the same thing and encodes duplicates.
  const hasRVFC = typeof video.requestVideoFrameCallback === "function";
  function schedule() {
    if (hasRVFC) video.requestVideoFrameCallback((now) => onFrame(now));
    else requestAnimationFrame((now) => onFrame(now));
  }

  async function start() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          frameRate: { ideal: CAMERA_FPS },
        },
        audio: false,
      });
      video.srcObject = stream;
      setDot("dcam", true);
    } catch (e) {
      el("fatal").dataset.show = "true";
      el("fatalmsg").textContent =
        (location.protocol === "https:")
          ? String(e)
          : "This page must be served over HTTPS. Open the cloudflared URL, not the LAN address.";
      return;
    }

    const track = stream.getVideoTracks()[0];
    const s = track ? track.getSettings() : {};
    el("holdlabel").textContent =
      `Hold still to inspect — ${s.width || "?"}x${s.height || "?"} @ ${s.frameRate || "?"}fps` +
      (workerSupported ? "" : " (main-thread encode)");

    try { await navigator.wakeLock.request("screen"); } catch (_) { /* nice-to-have */ }

    if (workerSupported) startWorker(); else startFallback();
    schedule();
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    el("fatal").dataset.show = "true";
    el("fatalmsg").textContent =
      "getUserMedia is unavailable. Serve this page over HTTPS (cloudflared), not http://<lan-ip>.";
  } else {
    void start();
  }
})();
</script>
</body>
</html>
