<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Ambit — capture</title>
<style>
  /* Served straight from the API so one tunnel covers the page, the socket and
     the upload. Same two colours, same font, same zero-radius rule as the app. */
  @font-face {
    font-family: "CMU Typewriter Text";
    src: url("/fonts/cmu-typewriter-text-500-roman.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  html, body {
    background: #000; color: #e8e8e8; height: 100%; overflow: hidden;
    font-family: "CMU Typewriter Text", ui-monospace, monospace;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  .bar {
    position: fixed; left: 0; right: 0; display: flex; align-items: center;
    gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(0,0,0,0.72); border-bottom: 1px solid #262626;
  }
  #top { top: 0; }
  .dot { width: 8px; height: 8px; background: #5f5f5f; flex: 0 0 auto; }
  .dot[data-on="true"] { background: #ff2d2d; }
  .spacer { flex: 1 1 auto; }
  .faint { color: #5f5f5f; }

  /* Hold-still progress. A flat bar -- no ring, no easing, no gradient. */
  #holdwrap {
    position: fixed; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom));
    border: 1px solid #262626; background: rgba(0,0,0,0.72); padding: 10px;
  }
  #holdlabel { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
  #holdtrack { margin-top: 8px; height: 6px; background: #111; border: 1px solid #262626; }
  #holdfill { height: 100%; width: 0%; background: #ff2d2d; }

  #verdict {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.86); border-top: 1px solid #262626; min-height: 84px;
  }
  #vline { display: flex; align-items: baseline; gap: 10px; }
  #vbadge {
    font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid #3a3a3a; padding: 3px 8px; color: #9a9a9a;
  }
  #vbadge[data-attention="true"] { color: #ff2d2d; border-color: #ff2d2d; }
  #vmeta { font-size: 12px; color: #9a9a9a; }
  #vnote { margin-top: 6px; font-size: 12px; color: #5f5f5f; line-height: 1.45; }

  /* The whole frame flashes red only when something actually wants attention. */
  #stage[data-attention="true"]::after {
    content: ""; position: fixed; inset: 0; border: 3px solid #ff2d2d; pointer-events: none;
  }
  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
    background: #000; text-align: center; font-size: 14px; line-height: 1.6;
  }
  #fatal[data-show="true"] { display: grid; }
  #fatal strong { color: #ff2d2d; display: block; margin-bottom: 10px; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline muted></video>
</div>

<div class="bar" id="top">
  <span class="dot" id="dcam"></span><span>cam</span>
  <span class="dot" id="dws"></span><span>link</span>
  <span class="spacer"></span>
  <span class="faint" id="sid"></span>
  <span class="faint" id="fps"></span>
</div>

<div id="holdwrap">
  <div id="holdlabel">Hold still to inspect</div>
  <div id="holdtrack"><div id="holdfill"></div></div>
</div>

<div id="verdict">
  <div id="vline">
    <span id="vbadge">standby</span>
    <span id="vmeta"></span>
  </div>
  <div id="vnote">Point at a board and hold steady for two seconds.</div>
</div>

<div id="fatal"><div><strong>Camera unavailable</strong><span id="fatalmsg"></span></div></div>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const SESSION = params.get("s") || "demo";

  /* --------------------------------------------------------------------
   * Frame rate is camera-bound, not pipeline-bound.
   *
   * Measured: the relay and the projected canvas sustain 120 fps with zero
   * drops, so nothing downstream is the limit. Everything here exists to stop
   * the phone from being one:
   *
   *   - requestVideoFrameCallback paces capture to the camera itself, so we
   *     never encode the same frame twice and never miss one. A rAF loop at a
   *     fixed interval does both.
   *   - JPEG encoding runs in a worker on an OffscreenCanvas. On the main
   *     thread it competed with the viewfinder's own compositing.
   *   - The worker owns the socket, so frame bytes never touch the main thread.
   *   - Quality adapts to the uplink instead of frames being dropped: a phone
   *     on hotel wifi degrades to softer frames at full rate rather than a
   *     stuttering slideshow.
   * ------------------------------------------------------------------ */
  const PREVIEW_W = 480, PREVIEW_H = 360;
  const CAMERA_FPS = 60;           // asked for; the device grants what it can
  const Q_MAX = 0.62, Q_MIN = 0.28, Q_START = 0.5;
  const UPLINK_HIGH = 192 * 1024;  // back off quality above this backlog
  const UPLINK_LOW = 48 * 1024;    // recover quality below it
  const MAX_INFLIGHT = 3;          // outstanding encodes before we skip a frame

  const MOTION_HZ = 8;             // getImageData is a GPU stall; 8Hz resolves a 2s hold
  const HOLD_MS = 2000;
  const STILL_THRESHOLD = 0.012;
  const MOVED_THRESHOLD = 0.030;

  const el = (id) => document.getElementById(id);
  const video = el("v");
  el("sid").textContent = SESSION;

  const probe = document.createElement("canvas");
  probe.width = 64; probe.height = 48;
  const xctx = probe.getContext("2d", { willReadFrequently: true });

  const full = document.createElement("canvas");
  const fctx = full.getContext("2d");

  let prevLuma = null, stillMs = 0, state = "idle";
  let lastMotion = 0, inflight = 0, wsReady = false;
  let framesSent = 0, fpsCount = 0, fpsAt = 0, quality = Q_START;
  // Mirrored back from the worker. Adapting quality is not sufficient on its
  // own: measured, a producer outrunning the socket pushed the backlog to 23 MB
  // even with quality pinned at the floor, because dropping 0.62 -> 0.28 only
  // halves the bytes. The producer has to stop, so the worker's view of
  // bufferedAmount has to reach the thread that decides whether to capture.
  let socketBacklog = 0, skippedForBacklog = 0;

  /* ---------------- encoder worker ---------------- */
  // Inlined as a blob so the phone client stays a single file. A blob worker
  // inherits this origin, so its socket needs no extra CORS or auth.
  const WORKER_SRC = `
    let ws = null, canvas = null, ctx = null, quality = ${Q_START}, sent = 0;
    const Q_MAX = ${Q_MAX}, Q_MIN = ${Q_MIN};
    const HIGH = ${UPLINK_HIGH}, LOW = ${UPLINK_LOW};
    let clearStreak = 0;

    function connect(url) {
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => postMessage({ type: "ws", ready: true });
      ws.onclose = () => { postMessage({ type: "ws", ready: false }); setTimeout(() => connect(url), 1000); };
      ws.onerror = () => ws && ws.close();
    }

    self.onmessage = async (e) => {
      const m = e.data;
      if (m.type === "connect") { connect(m.url); return; }
      if (m.type === "json") { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m.payload)); return; }
      // While saturated the producer stops sending frames, so frame-carried
      // backlog reports stop too and its reading would stay stale-high forever.
      // A poll is how the producer learns the socket has drained.
      if (m.type === "poll") {
        postMessage({ type: "sent", sent, quality, buffered: ws ? ws.bufferedAmount : 0 });
        return;
      }
      if (m.type !== "frame") return;

      const bmp = m.bitmap;
      if (!ws || ws.readyState !== 1) { bmp.close(); postMessage({ type: "done" }); return; }

      // Adapt quality to the backlog rather than dropping frames outright.
      if (ws.bufferedAmount > HIGH) {
        quality = Math.max(Q_MIN, quality - 0.06);
        clearStreak = 0;
      } else if (ws.bufferedAmount < LOW && ++clearStreak > 30) {
        quality = Math.min(Q_MAX, quality + 0.02);
        clearStreak = 0;
      }

      if (!canvas) {
        canvas = new OffscreenCanvas(${PREVIEW_W}, ${PREVIEW_H});
        ctx = canvas.getContext("2d", { alpha: false });
      }
      ctx.drawImage(bmp, 0, 0, ${PREVIEW_W}, ${PREVIEW_H});
      bmp.close();

      try {
        const blob = await canvas.convertToBlob({ type: "image/jpeg", quality });
        if (ws && ws.readyState === 1) { ws.send(blob); sent++; }
        postMessage({ type: "sent", sent, quality, buffered: ws ? ws.bufferedAmount : 0 });
      } catch (err) {
        postMessage({ type: "encerr", message: String(err) });
      }
      postMessage({ type: "done" });
    };
  `;

  const workerSupported =
    typeof Worker !== "undefined" &&
    typeof OffscreenCanvas !== "undefined" &&
    typeof createImageBitmap === "function" &&
    OffscreenCanvas.prototype.convertToBlob;

  let worker = null;
  // Fallback path for iOS below 16.4, which lacks OffscreenCanvas.convertToBlob.
  let fbCanvas = null, fbCtx = null, fbSocket = null;

  function setDot(id, on) { el(id).dataset.on = on ? "true" : "false"; }

  function send(obj) {
    if (worker) worker.postMessage({ type: "json", payload: obj });
    else if (fbSocket && fbSocket.readyState === 1) fbSocket.send(JSON.stringify(obj));
  }

  function setPhase(phase, extra) {
    state = phase;
    send(Object.assign({ type: "phase", phase: phase }, extra || {}));
  }

  function socketUrl() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    return `${scheme}://${location.host}/live/publish/${encodeURIComponent(SESSION)}`;
  }

  function startWorker() {
    worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "application/javascript" })));
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "ws") {
        wsReady = m.ready;
        setDot("dws", m.ready);
        if (m.ready) setPhase(state); else socketBacklog = 0;
      } else if (m.type === "sent") {
        framesSent = m.sent; quality = m.quality; socketBacklog = m.buffered;
      } else if (m.type === "done") {
        inflight = Math.max(0, inflight - 1);
      }
    };
    worker.postMessage({ type: "connect", url: socketUrl() });
  }

  function startFallback() {
    fbCanvas = document.createElement("canvas");
    fbCanvas.width = PREVIEW_W; fbCanvas.height = PREVIEW_H;
    fbCtx = fbCanvas.getContext("2d", { alpha: false });
    const open = () => {
      fbSocket = new WebSocket(socketUrl());
      fbSocket.binaryType = "arraybuffer";
      fbSocket.onopen = () => { wsReady = true; setDot("dws", true); setPhase(state); };
      fbSocket.onclose = () => { wsReady = false; setDot("dws", false); setTimeout(open, 1000); };
      fbSocket.onerror = () => fbSocket.close();
    };
    open();
  }

  function pushFrame() {
    if (!wsReady || inflight >= MAX_INFLIGHT) return;
    // Hard stop, not a quality nudge. Without this the backlog grows without
    // bound on a slow uplink and the viewfinder drifts minutes behind reality.
    if (socketBacklog > UPLINK_HIGH) {
      skippedForBacklog++;
      if (worker) worker.postMessage({ type: "poll" });  // re-read, or we never resume
      return;
    }

    if (worker) {
      inflight++;
      // resizeWidth is a hint; Safari may ignore it, in which case the worker's
      // drawImage does the scaling instead. Correct either way.
      createImageBitmap(video, { resizeWidth: PREVIEW_W, resizeHeight: PREVIEW_H, resizeQuality: "low" })
        .then((bmp) => worker.postMessage({ type: "frame", bitmap: bmp }, [bmp]))
        .catch(() => { inflight = Math.max(0, inflight - 1); });
      return;
    }

    if (fbSocket.bufferedAmount > UPLINK_HIGH) return;
    inflight++;
    fbCtx.drawImage(video, 0, 0, PREVIEW_W, PREVIEW_H);
    fbCanvas.toBlob((blob) => {
      inflight = Math.max(0, inflight - 1);
      if (blob && fbSocket && fbSocket.readyState === 1) { fbSocket.send(blob); framesSent++; }
    }, "image/jpeg", quality);
  }

  function motionScore() {
    xctx.drawImage(video, 0, 0, probe.width, probe.height);
    const d = xctx.getImageData(0, 0, probe.width, probe.height).data;
    const luma = new Uint8Array(probe.width * probe.height);
    for (let i = 0, p = 0; p < luma.length; i += 4, p++) {
      luma[p] = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;
    }
    if (!prevLuma) { prevLuma = luma; return 1; }
    let sum = 0;
    for (let p = 0; p < luma.length; p++) sum += Math.abs(luma[p] - prevLuma[p]);
    prevLuma = luma;
    return sum / luma.length / 255;
  }

  function setHold(fraction, label) {
    el("holdfill").style.width = `${Math.round(Math.min(1, fraction) * 100)}%`;
    el("holdlabel").textContent = label;
  }

  function setVerdict(badge, meta, note, attention) {
    el("vbadge").textContent = badge;
    el("vbadge").dataset.attention = attention ? "true" : "false";
    el("stage").dataset.attention = attention ? "true" : "false";
    el("vmeta").textContent = meta || "";
    el("vnote").textContent = note || "";
  }

  /**
   * PNG, not JPEG, and deliberately so. Measured against the registry, JPEG
   * recompression costs 0.01-0.024 of routing score -- enough to push a frame
   * under a tight coverage gate and turn a real inspection into a refusal.
   * The preview stays JPEG because it is a throwaway viewfinder; this is the
   * one frame that gets scored, so it is worth the extra megabytes.
   */
  function captureFull() {
    return new Promise((resolve) => {
      full.width = video.videoWidth || 1280;
      full.height = video.videoHeight || 720;
      fctx.drawImage(video, 0, 0, full.width, full.height);
      full.toBlob((b) => resolve(b), "image/png");
    });
  }

  /**
   * The phone owns the SSE stream and forwards each event over its own socket.
   * The relay stays a dumb pipe, and the projected view gets the agent's steps
   * without the server having to know a socket exists.
   */
  async function inspect() {
    setPhase("inspecting");
    setHold(1, "Inspecting…");
    setVerdict("working", "", "Uploading full-resolution frame to the agent.", false);

    const blob = await captureFull();
    send({ type: "captured", width: full.width, height: full.height, bytes: blob.size });

    const form = new FormData();
    form.append("image", blob, "phone.png");

    let res;
    try {
      res = await fetch("/inspect/stream", { method: "POST", body: form });
    } catch (e) {
      setVerdict("error", "", String(e), true);
      send({ type: "error", message: String(e) });
      return rearm();
    }
    if (!res.ok || !res.body) {
      const msg = `inspect responded ${res.status}`;
      setVerdict("error", "", msg, true);
      send({ type: "error", message: msg });
      return rearm();
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop() || "";
      for (const f of frames) {
        const evLine = f.split("\n").find((l) => l.startsWith("event: "));
        const dtLine = f.split("\n").find((l) => l.startsWith("data: "));
        if (!evLine || !dtLine) continue;
        const event = evLine.slice(7).trim();
        const data = JSON.parse(dtLine.slice(6));
        send({ type: event, data: data });

        if (event === "step") {
          setHold(1, data.label || data.node || "working");
        } else if (event === "result") {
          const attention = data.verdict === "defect" || data.verdict === "unroutable";
          const meta = [data.asset_class, data.latency_ms ? `${data.latency_ms} ms` : null]
            .filter(Boolean).join(" · ");
          setVerdict(data.verdict, meta, data.narrative || "", attention);
        } else if (event === "error") {
          setVerdict("error", "", data.message, true);
        }
      }
    }
    rearm();
  }

  function rearm() {
    stillMs = 0;
    setPhase("cooldown");
    setHold(0, "Move, then hold still again");
  }

  function stepMotion(now) {
    if (now - lastMotion < 1000 / MOTION_HZ) return;
    const dt = now - lastMotion;
    lastMotion = now;

    const score = motionScore();
    if (state === "inspecting") return;

    if (state === "cooldown") {
      if (score > MOVED_THRESHOLD) { state = "idle"; setPhase("idle"); }
      return;
    }

    if (score < STILL_THRESHOLD) {
      stillMs = Math.min(HOLD_MS, stillMs + dt);
      setHold(stillMs / HOLD_MS, `Holding ${(stillMs / 1000).toFixed(1)}s / 2.0s`);
      send({ type: "phase", phase: "holding", progress: stillMs / HOLD_MS });
      if (stillMs >= HOLD_MS) void inspect();
    } else {
      if (stillMs > 0) setHold(0, "Hold still to inspect");
      stillMs = 0;
    }
  }

  function onFrame(now) {
    if (video.readyState >= 2) {
      pushFrame();
      stepMotion(now);
      if (now - fpsAt > 1000) {
        // Divide by measured elapsed time: assuming the nominal interval turns
        // a stall into an inflated number instead of an obviously low one.
        const fps = Math.round(((framesSent - fpsCount) * 1000) / (now - fpsAt));
        // Show the skip count when the uplink is the limit, so a stuttering
        // viewfinder reads as "network", not "broken".
        el("fps").textContent =
          `${fps} fps q${quality.toFixed(2)}` + (skippedForBacklog ? ` -${skippedForBacklog}` : "");
        fpsCount = framesSent; fpsAt = now;
      }
    }
    schedule();
  }

  // rVFC fires once per decoded camera frame -- the correct clock for this.
  // rAF is the fallback, and free-runs at display rate rather than camera rate.
  const hasRVFC = typeof video.requestVideoFrameCallback === "function";
  function schedule() {
    if (hasRVFC) video.requestVideoFrameCallback((now) => onFrame(now));
    else requestAnimationFrame((now) => onFrame(now));
  }

  async function start() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          frameRate: { ideal: CAMERA_FPS },
        },
        audio: false,
      });
      video.srcObject = stream;
      setDot("dcam", true);
    } catch (e) {
      el("fatal").dataset.show = "true";
      el("fatalmsg").textContent =
        (location.protocol === "https:")
          ? String(e)
          : "This page must be served over HTTPS. Open the cloudflared URL, not the LAN address.";
      return;
    }

    const track = stream.getVideoTracks()[0];
    const settings = track ? track.getSettings() : {};
    el("holdlabel").textContent =
      `Hold still to inspect — camera ${settings.frameRate || "?"}fps` +
      (workerSupported ? "" : " (main-thread encode)");

    try { await navigator.wakeLock.request("screen"); } catch (_) { /* nice-to-have */ }

    if (workerSupported) startWorker(); else startFallback();
    schedule();
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    el("fatal").dataset.show = "true";
    el("fatalmsg").textContent =
      "getUserMedia is unavailable. Serve this page over HTTPS (cloudflared), not http://<lan-ip>.";
  } else {
    void start();
  }
})();
</script>
</body>
</html>
